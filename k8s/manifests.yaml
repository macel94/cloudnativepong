# Kubernetes manifests for Cloud Native Pong.
#
# Quick deploy:
#   kubectl apply -f k8s/
#
# What this creates:
#   - namespace: pong
#   - ServiceAccount + RBAC: allows lobby to create/delete room pods
#   - Deployment: lobby server (1 replica)
#   - Service: exposes lobby on port 8080

---
apiVersion: v1
kind: Namespace
metadata:
  name: pong

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pong-lobby
  namespace: pong

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pong-pod-manager
  namespace: pong
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pong-lobby-pod-manager
  namespace: pong
subjects:
  - kind: ServiceAccount
    name: pong-lobby
    namespace: pong
roleRef:
  kind: Role
  name: pong-pod-manager
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-lobby
  namespace: pong
  labels:
    app: cloudnativepong
    role: lobby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudnativepong
      role: lobby
  template:
    metadata:
      labels:
        app: cloudnativepong
        role: lobby
    spec:
      serviceAccountName: pong-lobby
      containers:
        - name: lobby
          image: cloudnativepong:latest
          imagePullPolicy: IfNotPresent
          args: ["--mode=lobby", "--namespace=pong"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOBBY_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /api/rooms
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: pong-lobby
  namespace: pong
spec:
  selector:
    app: cloudnativepong
    role: lobby
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP