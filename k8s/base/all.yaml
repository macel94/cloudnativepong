# Kubernetes manifests for Cloud Native Pong.
#
# Quick deploy (use the disposable local test overlay):
#   kubectl apply -k k8s/overlays/test
#
# What this creates:
#   - namespace: pong
#   - Gateway: reverse-proxy entry point (NodePort)
#   - Static: serves frontend assets (ClusterIP)
#   - API: lobby server with SQLite persistence (ClusterIP)
#   - RBAC: ServiceAccount + Role + RoleBinding for K8s pod management
#   - ConfigMap: room pod template for the API to create game pods

---
apiVersion: v1
kind: Namespace
metadata:
  name: pong
  annotations:
    # The namespace contains the SQLite PVC. Protect both from Flux garbage
    # collection during future source/Kustomization ownership changes.
    kustomize.toolkit.fluxcd.io/prune: disabled

# ──────────────────────────────────────────────
# Gateway — reverse proxy / entry point
# Routes /api/* → API service, /* → Static service
# Exposed externally via NodePort
# ──────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-gateway
  namespace: pong
  labels:
    app: cloudnativepong
    component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudnativepong
      component: gateway
  template:
    metadata:
      labels:
        app: cloudnativepong
        component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: cloudnativepong-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pong-gateway
  namespace: pong
  labels:
    app: cloudnativepong
    component: gateway
spec:
  selector:
    app: cloudnativepong
    component: gateway
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      name: http
  type: NodePort

# ──────────────────────────────────────────────
# Static — serves frontend HTML/CSS/JS assets
# Internal ClusterIP only — accessed via gateway
# ──────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-static
  namespace: pong
  labels:
    app: cloudnativepong
    component: static
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudnativepong
      component: static
  template:
    metadata:
      labels:
        app: cloudnativepong
        component: static
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: static
          image: cloudnativepong-static:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 16Mi
          startupProbe:
            httpGet:
              path: /
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pong-static
  namespace: pong
  labels:
    app: cloudnativepong
    component: static
spec:
  selector:
    app: cloudnativepong
    component: static
  ports:
    - port: 80
      targetPort: 8080
      name: http
  type: ClusterIP

# ──────────────────────────────────────────────
# API (Lobby) — room management, game logic
# Persists room state to a SQLite database on a
# PersistentVolumeClaim (1 Gi).
# Has RBAC permissions to create/delete room pods.
# ──────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pong-api-data
  namespace: pong
  annotations:
    # Never delete the database claim as part of application reconciliation.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: cloudnativepong
    component: api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-api
  namespace: pong
  labels:
    app: cloudnativepong
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudnativepong
      component: api
  template:
    metadata:
      labels:
        app: cloudnativepong
        component: api
    spec:
      serviceAccountName: pong-lobby
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: cloudnativepong-api:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--mode=lobby"
            - "--namespace=pong"
            - "--room-image=cloudnativepong-room:latest"
            - "--db-path=/data/pong.db"
            # To enable native WebTransport, add:
            # - "--webtransport-addr=:8443"
            # - "--webtransport-public-url=https://pong.belacca.com/rooms/{room}/wt"
            # and mount certificate/key files from an approved Secret.
          ports:
            - containerPort: 8080
              name: http
            # Native WebTransport is opt-in; the listener is disabled unless
            # PONG_WEBTRANSPORT_ADDR and TLS paths are configured.
            - containerPort: 8443
              name: webtransport
              protocol: UDP
          env:
            - name: LOBBY_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ROOM_POD_TEMPLATE
              value: /etc/room-template/template.json
            - name: PONG_ALLOWED_ORIGINS
              value: http://localhost:8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: room-template
              mountPath: /etc/room-template
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/rooms
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pong-api-data
        - name: room-template
          configMap:
            name: pong-room-template
---
apiVersion: v1
kind: Service
metadata:
  name: pong-api
  namespace: pong
  labels:
    app: cloudnativepong
    component: api
spec:
  selector:
    app: cloudnativepong
    component: api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
# Optional native WebTransport transport. This ClusterIP is intentionally not
# public by itself; expose it through an approved UDP-capable load balancer or
# NodePort only after configuring TLS and the platform NetworkPolicy.
apiVersion: v1
kind: Service
metadata:
  name: pong-api-webtransport
  namespace: pong
  labels:
    app: cloudnativepong
    component: api
    transport: webtransport
spec:
  selector:
    app: cloudnativepong
    component: api
  ports:
    - port: 8443
      targetPort: 8443
      name: webtransport
      protocol: UDP
  type: ClusterIP

# ──────────────────────────────────────────────
# RBAC — ServiceAccount, Role, and RoleBinding
# Grants the lobby (API) pod permissions to
# create, list, watch, and delete pods in the
# pong namespace (dynamically spawning room pods).
# ──────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pong-lobby
  namespace: pong
  labels:
    app: cloudnativepong
    component: api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pong-pod-manager
  namespace: pong
  labels:
    app: cloudnativepong
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pong-lobby-pod-manager
  namespace: pong
  labels:
    app: cloudnativepong
subjects:
  - kind: ServiceAccount
    name: pong-lobby
    namespace: pong
roleRef:
  kind: Role
  name: pong-pod-manager
  apiGroup: rbac.authorization.k8s.io

# ──────────────────────────────────────────────
# Room Pod Template — ConfigMap
# The API reads this JSON to know what pod spec
# to POST to the K8s API when spawning a game
# room. Each room pod runs in "room" mode and
# connects back to the lobby for WebSocket relay.
# ──────────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pong-room-template
  namespace: pong
  labels:
    app: cloudnativepong
data:
  template.json: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "generateName": "pong-room-",
        "labels": {
          "app": "cloudnativepong",
          "role": "room"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "runAsGroup": 65532,
          "seccompProfile": { "type": "RuntimeDefault" }
        },
        "containers": [
          {
            "name": "pong-room",
            "image": "cloudnativepong-room:latest",
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": { "drop": ["ALL"] },
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": true
            },
            "args": [
              "--mode=room",
              "--room-id=${ROOM_ID}",
              "--lobby-addr=${LOBBY_ADDR}"
            ],
            "env": [
              {
                "name": "PONG_ALLOWED_ORIGINS",
                "value": "https://pong.belacca.com"
              }
            ],
            "ports": [
              { "containerPort": 8080 }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "200m",
                "memory": "64Mi"
              }
            },
            "env": [
              {
                "name": "LOBBY_HOST",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              }
            ]
          }
        ],
        "restartPolicy": "Never",
        "activeDeadlineSeconds": 7200,
        "terminationGracePeriodSeconds": 5
      }
    }