apiVersion: v1
kind: ConfigMap
metadata:
  name: pong-room-template
  namespace: pong
data:
  template.json: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "generateName": "pong-room-",
        "labels": {
          "app": "cloudnativepong",
          "role": "room"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "runAsGroup": 65532,
          "seccompProfile": { "type": "RuntimeDefault" }
        },
        "containers": [
          {
            "name": "pong-room",
            "image": "cloudnativepong-room:latest",
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": { "drop": ["ALL"] },
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": true
            },
            "args": [
              "--mode=room",
              "--room-id=${ROOM_ID}",
              "--lobby-addr=${LOBBY_ADDR}"
            ],
            "env": [
              {
                "name": "PONG_ALLOWED_ORIGINS",
                "value": "http://localhost:8080"
              },
              {
                "name": "LOBBY_HOST",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              }
            ],
            "ports": [
              { "containerPort": 8080 }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "memory": "64Mi"
              }
            }
          }
        ],
        "restartPolicy": "Never",
        "activeDeadlineSeconds": 7200,
        "terminationGracePeriodSeconds": 5
      }
    }
