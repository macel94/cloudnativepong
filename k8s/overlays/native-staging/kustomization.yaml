apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pong

# The native cluster runs standalone Prometheus with file-based rules in the
# GitOps observability bundle. It does not install Prometheus Operator CRDs, so
# the PrometheusRule used by the server overlay must not be emitted here.
resources:
  - ../../base

images:
  - name: cloudnativepong-api
    newName: ghcr.io/macel94/cloudnativepong-api
    digest: sha256:027ebb28eeb0dff69111a9c17cad7c5cddb6e9b096dd7633ba15a9659e238529
  - name: cloudnativepong-room
    newName: ghcr.io/macel94/cloudnativepong-room
    digest: sha256:e133bc420f3d8f0a2beaa553d3754d99e525f4976e1bc18e35f92f160510a39d
  - name: cloudnativepong-static
    newName: ghcr.io/macel94/cloudnativepong-static
    digest: sha256:362cfc8771dd4d8700dd2c2a7c2fa957a9d53413bc12c2156bf3029a005e5389
  - name: cloudnativepong-gateway
    newName: ghcr.io/macel94/cloudnativepong-gateway
    digest: sha256:58940b237c40a0a8afc0c82a096b9db9505093a101830b27e770675041754a15

patches:
  - path: api-native-staging.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pong-api
      namespace: pong
  - path: deployment-pull-policy.yaml
  - path: api-resources.yaml
  - path: static-resources.yaml
  - path: gateway-private.yaml
    target:
      version: v1
      kind: Service
      name: pong-gateway
      namespace: pong
  - path: pvc-longhorn.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: pong-api-data
      namespace: pong
  - path: remove-webtransport-port.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pong-api
      namespace: pong
  - path: remove-webtransport-service.yaml
  - path: room-template.yaml
