apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pong-api-data
  namespace: pong
  annotations:
    # Keep the SQLite database claim across Flux ownership changes and
    # protect it from both GitOps pruning and generic release cleanup.
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  storageClassName: longhorn
