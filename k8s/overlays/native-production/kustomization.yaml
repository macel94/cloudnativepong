apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pong

resources:
  - ../../base

images:
  - name: cloudnativepong-api
    newName: ghcr.io/macel94/cloudnativepong-api
    newTag: sha-858b2847522a9043c00ad2f9ea1f90a578861c58
  - name: cloudnativepong-room
    newName: ghcr.io/macel94/cloudnativepong-room
    newTag: sha-858b2847522a9043c00ad2f9ea1f90a578861c58
  - name: cloudnativepong-static
    newName: ghcr.io/macel94/cloudnativepong-static
    newTag: sha-858b2847522a9043c00ad2f9ea1f90a578861c58
  - name: cloudnativepong-gateway
    newName: ghcr.io/macel94/cloudnativepong-gateway
    newTag: sha-858b2847522a9043c00ad2f9ea1f90a578861c58

patches:
  - path: api-native-production.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pong-api
      namespace: pong
  - path: deployment-pull-policy.yaml
  - path: static-resources.yaml
  - path: gateway-private.yaml
    target:
      version: v1
      kind: Service
      name: pong-gateway
      namespace: pong
  - path: pvc-longhorn.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: pong-api-data
      namespace: pong
  - path: remove-webtransport-port.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pong-api
      namespace: pong
  - path: remove-webtransport-service.yaml
  - path: room-template.yaml
