apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pong

resources:
  - ../../base
  - resource-quota.yaml
  - hpa.yaml
  - capacity-alerts.yaml

images:
  - name: cloudnativepong-api
    newName: ghcr.io/macel94/cloudnativepong-api
    digest: sha256:37b4941e3953c68d00b83b27049f328859915c73dd736d8c00f443d33a3b0699
  - name: cloudnativepong-room
    newName: ghcr.io/macel94/cloudnativepong-room
    digest: sha256:492ec7f3bd6f371dd0980967b0f0e582d3704f2fbd268c299029bd9705dd34db
  - name: cloudnativepong-static
    newName: ghcr.io/macel94/cloudnativepong-static
    digest: sha256:81dc65225457eedd2dbeb158432e6370a76ff36aa19b6c6d3be2d0c8b49c288e
  - name: cloudnativepong-gateway
    newName: ghcr.io/macel94/cloudnativepong-gateway
    digest: sha256:83a127f44538fe2dc1576be4c42aa7e459db2df1b8d81708de27b0f2799d77f5

patches:
  - path: deployment-pull-policy.yaml
  - path: api-resources.yaml
  - path: api-recreate-strategy.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pong-api
      namespace: pong
  - path: api-production.yaml
  - path: room-template.yaml
  - path: stateless-replicas.yaml
