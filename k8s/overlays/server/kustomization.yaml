apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pong

resources:
  - ../../base
  - resource-quota.yaml
  - hpa.yaml
  - capacity-alerts.yaml

images:
  - name: cloudnativepong-api
    newName: ghcr.io/macel94/cloudnativepong-api
    digest: sha256:63f5b0233a9461098f89064941a2d084a48343abd159fc5e6753cc74a5483ed4
  - name: cloudnativepong-room
    newName: ghcr.io/macel94/cloudnativepong-room
    digest: sha256:f4c1e604d606fac6a15849baa1c0b67f7355d50639f8081cdfd94d201cf570d0
  - name: cloudnativepong-static
    newName: ghcr.io/macel94/cloudnativepong-static
    digest: sha256:7d548a288bccc900f1b2c5ef4c95487689371f0381c1ca09b7ebfb671255d78c
  - name: cloudnativepong-gateway
    newName: ghcr.io/macel94/cloudnativepong-gateway
    digest: sha256:9c7e4b55c24476a2281f4c278486ed2116339cb00ecf870e6dddc1ac99821150

patches:
  - path: deployment-pull-policy.yaml
  - path: api-resources.yaml
  - path: api-recreate-strategy.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pong-api
      namespace: pong
  - path: api-production.yaml
  - path: room-template.yaml
  - path: stateless-replicas.yaml
