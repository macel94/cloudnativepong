apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pong

resources:
  - ../../base
  - resource-quota.yaml
  - hpa.yaml
  - capacity-alerts.yaml

images:
  - name: cloudnativepong-api
    newName: ghcr.io/macel94/cloudnativepong-api
    digest: sha256:3ae66863e02bf930fdf36e9df72046024df1b4e9eabbe45d1e71f2d4f2467c5f
  - name: cloudnativepong-room
    newName: ghcr.io/macel94/cloudnativepong-room
    digest: sha256:04d8779641169d415f95fa171a6d6570c1d2d8af54ade0f6b56297cde11bf291
  - name: cloudnativepong-static
    newName: ghcr.io/macel94/cloudnativepong-static
    digest: sha256:940c8a4d759ea4df346e720b6f12694fb5760c393fa2a292d52b0266fcb57239
  - name: cloudnativepong-gateway
    newName: ghcr.io/macel94/cloudnativepong-gateway
    digest: sha256:ff44a30ce9ea1861bc6975018dadb624c4ce0c95454b6ccdf2679561a41e9dff

patches:
  - path: deployment-pull-policy.yaml
  - path: api-resources.yaml
  - path: api-recreate-strategy.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pong-api
      namespace: pong
  - path: api-production.yaml
  - path: room-template.yaml
  - path: stateless-replicas.yaml
