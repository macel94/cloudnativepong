apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pong

resources:
  - ../../base
  - resource-quota.yaml
  - hpa.yaml
  - capacity-alerts.yaml

images:
  - name: cloudnativepong-api
    newName: ghcr.io/macel94/cloudnativepong-api
    digest: sha256:f72cbcaf7789603a792e124ec238cedd102f8a02c3be6ec3b0d18dd3fd360185
  - name: cloudnativepong-room
    newName: ghcr.io/macel94/cloudnativepong-room
    digest: sha256:fc4608c98d4bb6cb19c5dbd73c08098b888c22aad9d65f213e0e4b838ef596a9
  - name: cloudnativepong-static
    newName: ghcr.io/macel94/cloudnativepong-static
    digest: sha256:fba3447571ee8c496bc9394a55e292b758f526512b1c812ebb29bbfa25459071
  - name: cloudnativepong-gateway
    newName: ghcr.io/macel94/cloudnativepong-gateway
    digest: sha256:4ce62dfaacd12e3aaf98a1f498f70f3a605b28c1ab4f5e0dfb669d97aa0f8503

patches:
  - path: deployment-pull-policy.yaml
  - path: api-resources.yaml
  - path: api-recreate-strategy.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pong-api
      namespace: pong
  - path: api-production.yaml
  - path: room-template.yaml
  - path: stateless-replicas.yaml
