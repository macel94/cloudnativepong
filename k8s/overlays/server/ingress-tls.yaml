apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pong-tls
  namespace: pong
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - belacca.com
        - www.belacca.com
  rules:
    - host: belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pong-gateway
                port:
                  number: 80
    - host: www.belacca.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pong-gateway
                port:
                  number: 80
