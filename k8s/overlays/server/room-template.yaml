apiVersion: v1
kind: ConfigMap
metadata:
  name: pong-room-template
  namespace: pong
data:
  template.json: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "generateName": "pong-room-",
        "labels": {
          "app": "cloudnativepong",
          "role": "room"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "pong-room",
            "image": "ghcr.io/macel94/cloudnativepong-room:sha-212244a936984afc191f65fa93b36f45c4e6b5d8",
            "imagePullPolicy": "Always",
            "args": [
              "--mode=room",
              "--room-id=${ROOM_ID}",
              "--lobby-addr=${LOBBY_ADDR}"
            ],
            "ports": [
              { "containerPort": 8080 }
            ],
            "readinessProbe": {
              "httpGet": { "path": "/health", "port": 8080 },
              "initialDelaySeconds": 1,
              "periodSeconds": 5
            },
            "livenessProbe": {
              "httpGet": { "path": "/health", "port": 8080 },
              "initialDelaySeconds": 5,
              "periodSeconds": 10
            },
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "200m",
                "memory": "64Mi"
              }
            }
          }
        ],
        "restartPolicy": "Never",
        "activeDeadlineSeconds": 7200,
        "terminationGracePeriodSeconds": 5
      }
    }
