apiVersion: v1
kind: ConfigMap
metadata:
  name: pong-room-template
  namespace: pong
data:
  template.json: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "generateName": "pong-room-",
        "labels": {
          "app": "cloudnativepong",
          "role": "room"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "runAsGroup": 65532,
          "seccompProfile": { "type": "RuntimeDefault" }
        },
        "containers": [
          {
            "name": "pong-room",
            "image": "ghcr.io/macel94/cloudnativepong-room@sha256:f9ace803de8413113bd52ab86f833bb262664f3db190fe0eb3853455d478eca9",
            "imagePullPolicy": "Always",
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": { "drop": ["ALL"] },
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": true
            },
            "args": [
              "--mode=room",
              "--room-id=${ROOM_ID}",
              "--lobby-addr=${LOBBY_ADDR}"
            ],
            "env": [
              {
                "name": "PONG_ALLOWED_ORIGINS",
                "value": "https://pong.belacca.com"
              }
            ],
            "ports": [
              { "containerPort": 8080 }
            ],
            "startupProbe": {
              "httpGet": { "path": "/health", "port": 8080 },
              "failureThreshold": 30,
              "periodSeconds": 2
            },
            "readinessProbe": {
              "httpGet": { "path": "/health", "port": 8080 },
              "periodSeconds": 5
            },
            "livenessProbe": {
              "httpGet": { "path": "/health", "port": 8080 },
              "initialDelaySeconds": 5,
              "periodSeconds": 10
            },
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "memory": "64Mi"
              }
            }
          }
        ],
        "restartPolicy": "Never",
        "activeDeadlineSeconds": 7200,
        "terminationGracePeriodSeconds": 5
      }
    }
