# Cloud Native Pong gateway.
# NGINX handles the browser-facing HTTP/WebSocket upgrade and forwards the
# upgraded stream to the Go lobby service.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # The Kubernetes readiness probe must not depend on an upstream service.
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # REST API and the lobby's room WebSocket proxy.
    location /api/ {
        proxy_pass http://pong-api.pong.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rooms/ {
        proxy_pass http://pong-api.pong.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket streams must not be buffered or closed while idle.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Static frontend assets.
    location / {
        proxy_pass http://pong-static.pong.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
