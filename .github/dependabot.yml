version: 2
updates:
  # Go modules.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      go-deps:
        patterns:
          - "*"

  # npm dependencies used by Playwright tests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      npm-deps:
        patterns:
          - "*"

  # Docker base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    groups:
      docker-deps:
        patterns:
          - "*"

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions-deps:
        patterns:
          - "*"
