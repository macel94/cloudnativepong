version: 2
updates:
  # — Go modules —
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # — npm (Playwright tests) —
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # — Docker base images —
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # — GitHub Actions —
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch