name: Publish images

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'Dockerfile.*'
      - '.dockerignore'
      - 'build/caddy/**'
      - 'security/**'
      - 'scripts/create-vulnerability-decision.mjs'
      - 'gateway/Caddyfile'
      - 'static/Caddyfile'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'static/**'
      - 'gateway/**'
      - 'k8s/overlays/server/**'
      - 'k8s/overlays/native-staging/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

# Only one publisher may update a branch at a time. A publisher can still
# overlap an unrelated merge, so the deployment job also retries from the
# latest remote branch and refuses to publish an older source commit over a
# newer one.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

# The image jobs use GitHub Artifact Attestations for signed SLSA provenance.
# The deployment-recording job only needs permission to write the generated
# immutable tag references back to this repository.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/macel94/cloudnativepong

jobs:
  publish:
    if: "${{ !startsWith(github.event.head_commit.message, 'deploy: publish images') }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, room, static, gateway]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          # GitHub Artifact Attestations provide the signed SLSA provenance.
          # Keep the registry SBOM; GitHub Artifact Attestation is the canonical provenance.
          provenance: false
          sbom: true

      - name: Set immutable image identity
        id: image
        env:
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "reference=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: json
          output: cloudnativepong-${{ matrix.component }}.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln
          exit-code: '0'

      - name: Create native production vulnerability decision
        env:
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node scripts/create-vulnerability-decision.mjs \
            --input "cloudnativepong-${{ matrix.component }}.trivy.json" \
            --output "cloudnativepong-${{ matrix.component }}.vulnerability-decision.json" \
            --image "$IMAGE_NAME" \
            --digest "$IMAGE_DIGEST"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const decision = JSON.parse(await readFile(process.argv[1], "utf8"));
            if (["HIGH", "CRITICAL"].includes(decision.maxSeverity) || decision.knownUnfixed) {
              throw new Error(`native-production-v1 promotion blocked: maxUnfixedSeverity=${decision.maxSeverity}, maxObservedSeverity=${decision.maxObservedSeverity}, knownUnfixed=${decision.knownUnfixed}`);
            }
          ' "cloudnativepong-${{ matrix.component }}.vulnerability-decision.json"

      - name: Generate registry SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.reference }}
          format: cyclonedx-json
          output-file: cloudnativepong-${{ matrix.component }}.sbom.cdx.json
          upload-artifact: false

      - name: Upload security evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cloudnativepong-${{ matrix.component }}-security-${{ github.sha }}
          path: |
            cloudnativepong-${{ matrix.component }}.trivy.json
            cloudnativepong-${{ matrix.component }}.vulnerability-decision.json
            security/pong.openvex.json
          if-no-files-found: warn

      - name: Attest image provenance with GitHub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM with GitHub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: cloudnativepong-${{ matrix.component }}.sbom.cdx.json
          push-to-registry: true

      - name: Attest native production vulnerability decision
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://belacca.com/attestations/vulnerability/v1
          predicate-path: cloudnativepong-${{ matrix.component }}.vulnerability-decision.json
          push-to-registry: true

  record-deployment:
    name: Record immutable image tags
    if: "${{ !startsWith(github.event.head_commit.message, 'deploy: publish images') }}"
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update production image references
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          digests=()
          for component in api room static gateway; do
            image="macel94/cloudnativepong-${component}"
            token=$(curl --fail --silent --show-error --location \
              --user "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${image}:pull" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            digest=$(curl --fail --silent --show-error --location \
              --dump-header - --output /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${image}/manifests/${IMAGE_TAG}" \
              | awk 'BEGIN { IGNORECASE=1 } /^docker-content-digest:/ { print $2; exit }' \
              | tr -d '\r')
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "could not resolve immutable digest for ${image}:${IMAGE_TAG}" >&2
              exit 1
            fi
            digests+=("$digest")
          done
          PUBLISH_IMAGE_DIGESTS="${digests[*]}" ./scripts/publish-image-tags.sh
