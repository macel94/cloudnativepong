name: Publish images

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'Dockerfile.*'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'static/**'
      - 'gateway/**'
      - 'k8s/overlays/server/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/macel94/cloudnativepong

jobs:
  publish:
    if: "${{ !startsWith(github.event.head_commit.message, 'deploy: publish images') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application images
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          for component in api room static gateway; do
            image="${IMAGE_PREFIX}-${component}:${tag}"
            docker build --file "Dockerfile.${component}" --tag "$image" .
            docker push "$image"
          done

      - name: Update server image references
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          ./scripts/update-image-tag.sh "$tag"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/overlays/server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy: publish images ${tag}"
          git push
