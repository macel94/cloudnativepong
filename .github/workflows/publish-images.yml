name: Publish images

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'Dockerfile.*'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'static/**'
      - 'gateway/**'
      - 'k8s/overlays/server/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

# The image jobs use GitHub Artifact Attestations for signed SLSA provenance.
# The deployment-recording job only needs permission to write the generated
# immutable tag references back to this repository.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/macel94/cloudnativepong

jobs:
  publish:
    if: "${{ !startsWith(github.event.head_commit.message, 'deploy: publish images') }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, room, static, gateway]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          # GitHub Artifact Attestations provide the signed SLSA provenance.
          # Keep the registry SBOM; GitHub Artifact Attestation is the canonical provenance.
          provenance: false
          sbom: true

      - name: Attest image provenance with GitHub
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  record-deployment:
    name: Record immutable image tags
    if: "${{ !startsWith(github.event.head_commit.message, 'deploy: publish images') }}"
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update server image references
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          ./scripts/update-image-tag.sh "$tag"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/overlays/server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy: publish images ${tag}"
          git push
