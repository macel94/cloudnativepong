name: External synthetic checks

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# A scheduled run and a manual low-rate check must never exercise the public
# journey at the same time.
concurrency:
  group: synthetic-check
  cancel-in-progress: false

# The canonical target is public and does not require credentials. A repository
# or organization variable may override it for an approved alternate ingress;
# the optional token is only for a protected front door. The runner fails if
# the target cannot be reached or the journey does not complete.
permissions:
  contents: read

jobs:
  public-endpoints:
    name: Public endpoint and Pong journey
    runs-on: ubuntu-latest
    # The runner has a bounded 60-second journey and this step retains
    # independent retries for transient public-ingress failures.
    timeout-minutes: 10
    env:
      SYNTHETIC_BASE_URL: ${{ vars.SYNTHETIC_PONG_URL || 'https://pong.belacca.com' }}
      SYNTHETIC_AUTH_TOKEN: ${{ secrets.SYNTHETIC_AUTH_TOKEN }}
      # Room provisioning returns after the Service and Pod are accepted;
      # the WebSocket proxy absorbs bounded scheduling/image-pull cold starts.
      # Cleanup also includes Kubernetes Pod/Service deletion convergence.
      SYNTHETIC_TIMEOUT_MS: '60000'
      SYNTHETIC_REQUEST_TIMEOUT_MS: '60000'
      SYNTHETIC_CLEANUP_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install synthetic dependency
        run: npm ci --ignore-scripts
      - name: Validate synthetic runner
        env:
          SYNTHETIC_BASE_URL: ''
        run: npm run test:synthetic
      - name: Check public Pong endpoint and two-player journey
        id: synthetic
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p synthetic-artifacts
          max_attempts=3
          final_status=1

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            echo "Synthetic check attempt ${attempt}/${max_attempts}"
            if ./scripts/synthetic-check.sh > synthetic-artifacts/synthetic-result.log 2>&1; then
              cat synthetic-artifacts/synthetic-result.log
              final_status=0
              break
            else
              status=$?
              cat synthetic-artifacts/synthetic-result.log
            fi

            if (( attempt == max_attempts )); then
              echo "Synthetic check failed after ${max_attempts} attempts" >&2
              final_status="$status"
              break
            fi

            delay=$((10 ** attempt))
            echo "Synthetic check failed (exit ${status}); retrying in ${delay}s" >&2
            sleep "$delay"
          done

          printf '%s\n' "$final_status" > synthetic-artifacts/synthetic.exit-code
          exit "$final_status"

      - name: Retain canonical synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pong-synthetic-evidence-${{ github.run_id }}
          path: synthetic-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce synthetic result
        if: always()
        shell: bash
        run: test "$(cat synthetic-artifacts/synthetic.exit-code)" = 0
