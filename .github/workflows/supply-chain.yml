name: Supply chain checks

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.*'
      - '.dockerignore'
      - 'gateway/Caddyfile'
      - 'static/Caddyfile'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'static/**'
      - 'gateway/**'
      - 'scripts/supply-chain.sh'
      - '.github/workflows/supply-chain.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail on HIGH or CRITICAL findings (reviewed security run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    name: SBOM and vulnerability scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, room, static, gateway]
    env:
      IMAGE: cloudnativepong-${{ matrix.component }}:supply-chain
      STRICT: ${{ inputs.strict || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build local image
        run: |
          args=()
          if [[ "${{ matrix.component }}" == static ]]; then
            args+=(
              --build-arg "BUILD_SHA=${GITHUB_SHA}"
              --build-arg "BUILD_REPOSITORY=${GITHUB_REPOSITORY}"
            )
          fi
          docker build "${args[@]}" --file "Dockerfile.${{ matrix.component }}" --tag "$IMAGE" .

      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          artifact-name: cloudnativepong-${{ matrix.component }}.sbom.cdx.json
          output-file: cloudnativepong-${{ matrix.component }}.sbom.cdx.json
          upload-artifact: true

      - name: Scan image with Trivy (report-only by default)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: cloudnativepong-${{ matrix.component }}.trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ env.STRICT == 'true' && '1' || '0' }}

      - name: Validate immutable release contract
        if: matrix.component == 'api'
        env:
          ALLOW_PENDING_PUBLICATION: "${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'deploy: publish images') }}"
        run: |
          if [[ "$ALLOW_PENDING_PUBLICATION" == "true" ]]; then
            # The publish workflow has not yet converged both overlays for a
            # source push. Each overlay is still checked for immutable refs.
            python3 scripts/validate-release.py --allow-pending-publication
          else
            python3 scripts/validate-release.py
          fi

      - name: Upload vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloudnativepong-${{ matrix.component }}-trivy
          path: cloudnativepong-${{ matrix.component }}.trivy.json
          if-no-files-found: warn
