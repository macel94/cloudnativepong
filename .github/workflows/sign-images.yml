name: Sign published images (manual)

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Immutable GHCR image reference, including @sha256 digest'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign digest with Sigstore keyless identity
        env:
          IMAGE: ${{ inputs.image }}
        run: ./scripts/sign-image.sh "$IMAGE"
