name: Sign published images (manual)

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Immutable GHCR image reference, including @sha256 digest'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Sign digest with Sigstore keyless identity
        env:
          IMAGE: ${{ inputs.image }}
        run: ./scripts/sign-image.sh "$IMAGE"
