name: Test & Build

run-name: ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || format('{0} · {1}', github.ref_name, github.sha) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o cloudnativepong .

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  container:
    name: Container Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t cloudnativepong:latest .

      - name: Smoke-test container
        run: |
          docker run -d --rm -p 9090:8080 --name pong-ci cloudnativepong:latest --mode=local
          sleep 2
          curl -sf http://localhost:9090/api/rooms | grep '\[\]'
          curl -sf -X POST http://localhost:9090/api/rooms/create \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-test"}' | grep '"id"'
          curl -sf http://localhost:9090/ | grep '<!DOCTYPE'
          docker stop pong-ci

      - name: Show image size
        run: docker images cloudnativepong --format "{{.Size}}"