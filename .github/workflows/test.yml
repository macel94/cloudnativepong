name: Test & Build

run-name: ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast local-mode tests (single binary) ──────────────────────
  e2e-local:
    name: E2E (local mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true

      - name: Validate immutable release metadata and deployment tooling
        run: |
          python3 scripts/validate-release.py
          bash -n scripts/update-image-tag.sh scripts/update-image-tag.test.sh scripts/promote-digests.sh
          scripts/update-image-tag.test.sh

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o cloudnativepong .

      - name: Validate recovery helpers without cluster access
        run: |
          bash -n scripts/backup-restore.sh scripts/restore-rehearsal.sh
          ./scripts/backup-restore.sh self-test
          ./scripts/restore-rehearsal.sh self-test
          ./scripts/restore-rehearsal.sh --backup /tmp/example.db --dry-run \
            --i-understand-this-creates-an-isolated-cluster

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Playwright
        run: npm ci && npx playwright install chromium webkit --with-deps

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-local
          path: playwright-report/

  # ── Build all Docker images ────────────────────────────────────
  build-images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        run: docker build -t cloudnativepong-api:latest -f Dockerfile.api .

      - name: Build Room image
        run: docker build -t cloudnativepong-room:latest -f Dockerfile.room .

      - name: Build Static image
        run: docker build --build-arg BUILD_SHA="${GITHUB_SHA}" --build-arg BUILD_REPOSITORY="${GITHUB_REPOSITORY}" -t cloudnativepong-static:latest -f Dockerfile.static .

      - name: Build Gateway image
        run: docker build -t cloudnativepong-gateway:latest -f Dockerfile.gateway .

      - name: Show image sizes
        run: docker images --filter=reference='cloudnativepong-*' --format "table {{.Repository}}\t{{.Size}}"

  # ── Integration tests on k3d ───────────────────────────────────
  e2e-k8s:
    name: E2E (k3d)
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Setup k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          # Expose the pong-gateway NodePort (30080), not the default ingress on port 80.
          k3d cluster create pong --agents 2 --port 8080:30080@agent:0

      - name: Import images to k3d
        run: |
          # Rebuild and import (k3d uses its own containerd)
          docker build -t cloudnativepong-api:latest -f Dockerfile.api .
          docker build -t cloudnativepong-room:latest -f Dockerfile.room .
          docker build --build-arg BUILD_SHA="${GITHUB_SHA}" --build-arg BUILD_REPOSITORY="${GITHUB_REPOSITORY}" -t cloudnativepong-static:latest -f Dockerfile.static .
          docker build -t cloudnativepong-gateway:latest -f Dockerfile.gateway .
          k3d image import cloudnativepong-api:latest cloudnativepong-room:latest cloudnativepong-static:latest cloudnativepong-gateway:latest -c pong

      - name: Deploy disposable test overlay to k3d
        run: kubectl apply -k k8s/overlays/test

      - name: Wait for pods
        run: |
          if ! kubectl -n pong wait --for=condition=ready pod -l app=cloudnativepong --timeout=60s; then
            kubectl -n pong get pods -o wide
            kubectl -n pong describe pods
            exit 1
          fi
          kubectl -n pong get pods

      - name: Smoke-test via gateway
        run: |
          curl -sf http://localhost:8080/ | grep '<!DOCTYPE'
          curl -sf http://localhost:8080/api/rooms | grep '\[\]'
          curl -sf -X POST http://localhost:8080/api/rooms/create \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-test"}' | grep '"id"'

      - name: Run desktop E2E tests against gateway
        run: TEST_MODE=k8s npx playwright test --project=chromium --reporter=list

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-k8s
          path: playwright-report/

      - name: Cleanup
        if: always()
        run: k3d cluster delete pong