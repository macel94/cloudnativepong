# nginx config for Cloud Native Pong — static file server
# Serves HTML, CSS, and JS on port 8080 with CORS and WebSocket support headers.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for faster loads
    gzip on;
    gzip_types text/css application/javascript text/html application/json;
    gzip_min_length 256;

    # The build marker must not remain browser-cached across a production
    # rollout; it is the operator's visible source-of-truth hint.
    location = /build-info.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # ── Static files ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # ── CORS headers (applied to all responses) ───────────────────
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;

    # ── WebSocket support headers ─────────────────────────────────
    # These are sent proactively so the client knows the server supports upgrades.
    add_header X-WebSocket-Version "13" always;

    # ── Handle OPTIONS preflight ──────────────────────────────────
    location /api/ {
        # Static server does not serve /api/ — this blocks direct access
        # but returns proper CORS headers for preflight errors.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 204;
    }

    # ── Security headers ──────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Error pages ───────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}