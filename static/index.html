<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Native Pong — Lobby</title>
    <link rel="icon" href="/pong-favicon.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="build-version" data-build-version href="https://github.com/macel94/cloudnativepong/commits/main" target="_blank" rel="noopener noreferrer">build unknown</a>
    <div class="container">
        <header>
            <h1>🏓 Cloud Native Pong</h1>
            <p class="subtitle">Pick a name, join a room, play.</p>
        </header>

        <div class="player-setup">
            <input type="text" id="playerName" placeholder="Your display name" maxlength="20">
            <div class="name-actions">
                <button id="btnEditName" class="btn secondary" type="button">Edit Name</button>
                <button id="btnSaveName" class="btn primary" type="button">Save Name</button>
            </div>
            <p id="nameStatus" class="name-status" aria-live="polite"></p>
        </div>

        <div class="actions">
            <button id="btnNewRoom" class="btn primary">+ New Room</button>
            <button id="btnAI" class="btn secondary">🤖 Play vs Computer (AI)</button>
        </div>

        <div id="roomList" class="room-list">
            <h2>Active Rooms</h2>
            <div id="rooms" class="rooms"></div>
            <p id="noRooms" class="empty">No rooms yet. Create one!</p>
        </div>

        <div id="error" class="error hidden"></div>
    </div>

    <script src="/build-info.js"></script>
    <script src="/lobby.js"></script>
</body>
</html>
