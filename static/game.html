<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PONG — Game</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }
        #pongCanvas {
            display: block;
            width: min(100%, 800px);
            height: auto;
            aspect-ratio: 8 / 5;
            background: #1a1a2e;
            border-radius: 8px;
            box-shadow: 0 0 24px rgba(100, 100, 255, 0.2);
            touch-action: none;
        }
        .touch-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: min(100%, 420px);
        }
        .touch-control {
            min-width: 110px;
            min-height: 52px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 1.25rem;
            line-height: 1;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .touch-control span {
            font-size: 0.7rem;
            font-weight: 500;
        }
        .control-hint {
            color: #888;
            font-size: 0.85rem;
            text-align: center;
        }
        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            font-size: 2rem;
            font-weight: 700;
            font-family: monospace;
        }
        .score {
            padding: 8px 24px;
            background: #16213e;
            border-radius: 8px;
            min-width: 60px;
            text-align: center;
        }
        .vs {
            color: #888;
        }
        .status-bar {
            font-size: 0.9rem;
            color: #aaa;
        }
        .winner-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .winner-overlay h2 {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <a class="build-version" data-build-version href="https://github.com/macel94/cloudnativepong/commits/main" target="_blank" rel="noopener noreferrer">build unknown</a>
    <div class="container">
        <header>
            <h1>🏓 PONG</h1>
            <p id="roomLabel" class="subtitle">Room: —</p>
        </header>

        <div class="game-wrapper">
            <div class="scoreboard" aria-label="Scoreboard">
                <span id="score1" class="score">0</span>
                <span class="vs">vs</span>
                <span id="score2" class="score">0</span>
            </div>
            <canvas id="pongCanvas" width="800" height="500" role="img" aria-label="Pong game board"></canvas>
            <div id="touchControls" class="touch-controls" aria-label="Touch paddle controls">
                <button id="moveUp" class="touch-control btn secondary" type="button" aria-label="Move paddle up" aria-pressed="false">▲<span>Up</span></button>
                <button id="moveDown" class="touch-control btn secondary" type="button" aria-label="Move paddle down" aria-pressed="false">▼<span>Down</span></button>
            </div>
            <p id="controlHint" class="control-hint">Controls: W/S or touch buttons</p>
            <p id="status" class="status-bar" aria-live="polite">Waiting for opponent...</p>
        </div>

        <div id="winnerOverlay" class="winner-overlay hidden">
            <h2 id="winnerText"></h2>
            <a href="/" class="btn primary">Back to Lobby</a>
        </div>
    </div>

    <script src="/build-info.js"></script>
    <script src="/game.js"></script>
</body>
</html>
